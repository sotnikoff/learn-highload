# Тренажёр хай-лоада — вертикальный срез.
#
#   docker compose up -d --build          # инфраструктура + бэкенд + мониторинг
#   docker compose run --rm k6            # дать нагрузку (сценарий k6/load.js)
#   Grafana: http://localhost:3000 (дашборд "Highload Lab", вход без пароля)
#
# Бэкенд ученика ограничен по CPU/памяти, чтобы был виден реальный потолок.

services:
  # ---------- Инфраструктура полигона ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0          # один брокер в KRaft-режиме, без Zookeeper
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ---------- Полигон ученика ----------
  backend:
    build: ./backend
    command: ["/app/server"]
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
      KAFKA_BROKERS: kafka:9092
      ORDERS_TOPIC: orders
      DB_MAX_CONNS: "20"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  consumer:
    build: ./backend
    command: ["/app/consumer"]
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
      KAFKA_BROKERS: kafka:9092
      ORDERS_TOPIC: orders
      CONSUMER_GROUP: orders-writer
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ---------- Мониторинг ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver     # сюда k6 пишет свои метрики
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: on-failure

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://lab:lab@postgres:5432/lab?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  cadvisor:                              # CPU/память каждого контейнера
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports: ["8081:8080"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/highload-lab.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # ---------- Генератор нагрузки ----------
  # Не стартует с `up`, запускается вручную: docker compose run --rm k6
  # Другие параметры: docker compose run --rm -e RATE=5000 -e DURATION=10m k6
  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    command:
      - run
      - --address=0.0.0.0:6565          # REST API: пауза, VU, метрики
      - --out=experimental-prometheus-rw
      - /scripts/load.js
    environment:
      TARGET: http://backend:8080
      RATE: "1000"
      DURATION: "5m"
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./k6:/scripts:ro
    ports: ["6565:6565"]
    ulimits:
      nofile: { soft: 250000, hard: 250000 }
    depends_on: [backend]

volumes:
  pgdata:
