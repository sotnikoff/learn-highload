global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Метрики k6 сюда не скрейпятся — k6 сам пушит их через remote write.
scrape_configs:
  - job_name: backend
    static_configs: [{ targets: ["backend:8080"] }]

  - job_name: consumer
    static_configs: [{ targets: ["consumer:9100"] }]

  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]

  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
